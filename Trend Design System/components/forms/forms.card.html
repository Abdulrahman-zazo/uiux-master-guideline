<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:28px;background:var(--surface-canvas)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:500 10px/1.4 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { FormField, Input, Textarea, Select, Checkbox, Radio, Switch, SearchField, QuantityStepper } = window.TrendDesignSystem_7e8edd;
function Demo(){
const [q,setQ]=React.useState('');const [c,setC]=React.useState(true);const [r,setR]=React.useState('mada');
const [s,setS]=React.useState(true);const [n,setN]=React.useState(2);
return(<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
<FormField label="Full name" htmlFor="a" required><Input id="a" placeholder="Layla Al-Harbi"/></FormField>
<FormField label="Email" htmlFor="b" hint="Order updates go here"><Input id="b" iconStart="mail" placeholder="you@example.com"/></FormField>
<FormField label="Card number" htmlFor="c" error="Check this number"><Input id="c" invalid placeholder="4242 4242 4242 4242"/></FormField>
<FormField label="City" htmlFor="d" optional><Select id="d" placeholder="Choose a city" options={['Riyadh','Jeddah','Dammam']}/></FormField>
<FormField label="Search" ><SearchField value={q} onChange={setQ} placeholder="Search abayas, bags…" shortcut="⌘K"/></FormField>
<FormField label="Price"><Input suffix="SAR" placeholder="0.00" inputMode="decimal"/></FormField>
<FormField label="Order note"><Textarea rows={2} maxLength={120} placeholder="Leave at reception"/></FormField>
<div className="col" style={{gap:12}}>
<Checkbox checked={c} onChange={setC} label="Free shipping only"/>
<Checkbox indeterminate label="Select all" onChange={()=>{}}/>
<Radio name="p" value="mada" checked={r==='mada'} onChange={setR} label="Mada debit"/>
<Radio name="p" value="cod" checked={r==='cod'} onChange={setR} label="Cash on delivery"/>
<div className="row" style={{gap:20}}><Switch checked={s} onChange={setS} label="In stock"/><QuantityStepper value={n} onChange={setN}/></div>
</div></div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
