<!DOCTYPE html><html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trendsy — Web storefront UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-canvas);min-height:100vh}#root{min-height:100vh}
.wrap{max-width:var(--page-max);margin:0 auto;padding-inline:var(--page-gutter)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}@media(max-width:1024px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.9fr);gap:32px;align-items:start}@media(max-width:900px){.two{grid-template-columns:1fr}}
.hair{height:1px;background:var(--border-hairline)}
.section{padding-block:var(--section-gap)}
</style>
</head><body><div id="root"></div>

<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="discovery.jsx"></script>
<script type="text/babel" src="checkout.jsx"></script>
