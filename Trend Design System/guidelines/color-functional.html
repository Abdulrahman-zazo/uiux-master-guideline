<!-- @dsCard group="Colors" viewport="700x150" name="Functional hues — proposed" subtitle="Not on the brand sheet · awaiting approval" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-ui)}.g{display:flex;gap:0;border-radius:var(--radius-card-sm);overflow:hidden}.sw{flex:1;height:66px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 9px;gap:1px}.sw b{font:500 10.5px/1.2 var(--font-ui)}.sw span{font:400 9.5px/1.2 var(--font-numeric);opacity:.75}.rows{display:flex;flex-direction:column;gap:9px}.r{display:flex;align-items:center;gap:11px}.chip{width:34px;height:34px;border-radius:9px;flex:0 0 auto;border:1px solid rgba(9,9,9,.08)}.tk{font:400 11.5px/1.3 var(--font-numeric);color:var(--text-secondary)}.nm{font:500 12px/1.3 var(--font-ui);color:var(--text-primary);min-width:118px}.mu{font:400 11px/1.3 var(--font-ui);color:var(--text-muted)}</style></head><body><div class="rows">
<div class="r"><span class="chip" style="background:#2F7D5B"></span><span class="chip" style="background:#E8F3EE"></span><span class="nm">--success-600</span><span class="tk">#2F7D5B / #E8F3EE</span><span class="mu">Success — delivered, in stock, savings</span></div><div class="r"><span class="chip" style="background:#9A6410"></span><span class="chip" style="background:#FBF1E0"></span><span class="nm">--warning-600</span><span class="tk">#9A6410 / #FBF1E0</span><span class="mu">Warning — low stock, pending payment</span></div><div class="r"><span class="chip" style="background:#B3261E"></span><span class="chip" style="background:#FBEAE8"></span><span class="nm">--danger-600</span><span class="tk">#B3261E / #FBEAE8</span><span class="mu">Danger — failed payment, destructive actions</span></div>
</div><div class="mu" style="margin-top:12px;padding:8px 11px;background:var(--surface-brand-subtle);border-radius:var(--radius-tag);color:var(--text-brand)">Kept low-chroma so purple stays the loudest colour on any screen.</div></body></html>
