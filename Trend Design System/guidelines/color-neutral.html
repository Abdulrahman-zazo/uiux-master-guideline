<!-- @dsCard group="Colors" viewport="700x140" name="Neutral ramp" subtitle="Warm-cast greys resolving to the brand black" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-ui)}.g{display:flex;gap:0;border-radius:var(--radius-card-sm);overflow:hidden}.sw{flex:1;height:66px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 9px;gap:1px}.sw b{font:500 10.5px/1.2 var(--font-ui)}.sw span{font:400 9.5px/1.2 var(--font-numeric);opacity:.75}.rows{display:flex;flex-direction:column;gap:9px}.r{display:flex;align-items:center;gap:11px}.chip{width:34px;height:34px;border-radius:9px;flex:0 0 auto;border:1px solid rgba(9,9,9,.08)}.tk{font:400 11.5px/1.3 var(--font-numeric);color:var(--text-secondary)}.nm{font:500 12px/1.3 var(--font-ui);color:var(--text-primary);min-width:118px}.mu{font:400 11px/1.3 var(--font-ui);color:var(--text-muted)}</style></head><body><div class="g"><div class="sw" style="background:#FFFFFF;color:#090909"><b>0</b><span>#FFFFFF</span></div><div class="sw" style="background:#FAFAF9;color:#090909"><b>25</b><span>#FAFAF9</span></div><div class="sw" style="background:#F5F5F4;color:#090909"><b>50</b><span>#F5F5F4</span></div><div class="sw" style="background:#EBEBE9;color:#090909"><b>100</b><span>#EBEBE9</span></div><div class="sw" style="background:#DCDCD8;color:#090909"><b>200</b><span>#DCDCD8</span></div><div class="sw" style="background:#C2C2BD;color:#090909"><b>300</b><span>#C2C2BD</span></div><div class="sw" style="background:#9E9E98;color:#090909"><b>400</b><span>#9E9E98</span></div><div class="sw" style="background:#79766F;color:#fff"><b>500</b><span>#79766F</span></div><div class="sw" style="background:#57544E;color:#fff"><b>600</b><span>#57544E</span></div><div class="sw" style="background:#3F3D39;color:#fff"><b>700</b><span>#3F3D39</span></div><div class="sw" style="background:#262523;color:#fff"><b>800</b><span>#262523</span></div><div class="sw" style="background:#141413;color:#fff"><b>900</b><span>#141413</span></div><div class="sw" style="background:#090909;color:#fff"><b>950</b><span>#090909</span></div></div></body></html>
