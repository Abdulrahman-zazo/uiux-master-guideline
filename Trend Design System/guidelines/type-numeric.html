<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-ui)}.g{display:flex;gap:0;border-radius:var(--radius-card-sm);overflow:hidden}.sw{flex:1;height:66px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 9px;gap:1px}.sw b{font:500 10.5px/1.2 var(--font-ui)}.sw span{font:400 9.5px/1.2 var(--font-numeric);opacity:.75}.rows{display:flex;flex-direction:column;gap:9px}.r{display:flex;align-items:center;gap:11px}.chip{width:34px;height:34px;border-radius:9px;flex:0 0 auto;border:1px solid rgba(9,9,9,.08)}.tk{font:400 11.5px/1.3 var(--font-numeric);color:var(--text-secondary)}.nm{font:500 12px/1.3 var(--font-ui);color:var(--text-primary);min-width:118px}.mu{font:400 11px/1.3 var(--font-ui);color:var(--text-muted)}</style></head><body><div style="display:flex;gap:34px;align-items:flex-end">
<div><div class="lbl" style="font:500 10px/1.4 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)">Price · 36px</div><div style="font-family:var(--font-numeric);font-size:36px;font-weight:600;letter-spacing:-.02em;color:var(--text-brand);font-variant-numeric:tabular-nums">174<span style="font-size:22px;font-weight:500;color:var(--text-secondary);margin-inline-start:4px">SAR</span></div><div style="font-family:var(--font-numeric);font-size:16px;color:var(--text-muted);text-decoration:line-through;font-variant-numeric:tabular-nums">249</div></div>
<div><div style="font:500 10px/1.4 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)">Metric</div><div style="font-family:var(--font-numeric);font-size:36px;font-weight:600;letter-spacing:-.36px;font-variant-numeric:tabular-nums">184,290</div></div>
<div><div style="font:500 10px/1.4 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)">Arabic-Indic</div><div dir="rtl" style="font-family:var(--font-numeric);font-size:36px;font-weight:600;font-variant-numeric:tabular-nums">١٧٤ <span style="font-size:22px;font-weight:500;color:var(--text-secondary)">ر.س</span></div></div>
</div><div class="tk" style="margin-top:12px">A discounted price is the only body-level text allowed to be purple.</div></body></html>
