<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-ui)}.g{display:flex;gap:0;border-radius:var(--radius-card-sm);overflow:hidden}.sw{flex:1;height:66px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 9px;gap:1px}.sw b{font:500 10.5px/1.2 var(--font-ui)}.sw span{font:400 9.5px/1.2 var(--font-numeric);opacity:.75}.rows{display:flex;flex-direction:column;gap:9px}.r{display:flex;align-items:center;gap:11px}.chip{width:34px;height:34px;border-radius:9px;flex:0 0 auto;border:1px solid rgba(9,9,9,.08)}.tk{font:400 11.5px/1.3 var(--font-numeric);color:var(--text-secondary)}.nm{font:500 12px/1.3 var(--font-ui);color:var(--text-primary);min-width:118px}.mu{font:400 11px/1.3 var(--font-ui);color:var(--text-muted)}</style></head><body><div style="display:flex;gap:18px;padding:6px 2px 14px">
<div style="flex:1"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card-sm);box-shadow:var(--shadow-sm)"></div><div class="nm" style="min-width:0;margin-top:9px">--shadow-sm</div><div class="mu">Resting card</div></div><div style="flex:1"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card-sm);box-shadow:var(--shadow-md)"></div><div class="nm" style="min-width:0;margin-top:9px">--shadow-md</div><div class="mu">Primary button, dropdown</div></div><div style="flex:1"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card-sm);box-shadow:var(--shadow-lg)"></div><div class="nm" style="min-width:0;margin-top:9px">--shadow-lg</div><div class="mu">Card hover</div></div><div style="flex:1"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card-sm);box-shadow:var(--shadow-xl)"></div><div class="nm" style="min-width:0;margin-top:9px">--shadow-xl</div><div class="mu">Modal, toast</div></div><div style="flex:1"><div style="height:64px;background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card-sm);box-shadow:var(--shadow-brand)"></div><div class="nm" style="min-width:0;margin-top:9px">--shadow-brand</div><div class="mu">Primary button hover only</div></div></div></body></html>
