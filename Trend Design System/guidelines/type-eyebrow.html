<!-- @dsCard group="Type" viewport="700x140" name="Eyebrow label" subtitle="12px / 500 / +0.05em / uppercase — a signature move" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-ui)}.g{display:flex;gap:0;border-radius:var(--radius-card-sm);overflow:hidden}.sw{flex:1;height:66px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 9px;gap:1px}.sw b{font:500 10.5px/1.2 var(--font-ui)}.sw span{font:400 9.5px/1.2 var(--font-numeric);opacity:.75}.rows{display:flex;flex-direction:column;gap:9px}.r{display:flex;align-items:center;gap:11px}.chip{width:34px;height:34px;border-radius:9px;flex:0 0 auto;border:1px solid rgba(9,9,9,.08)}.tk{font:400 11.5px/1.3 var(--font-numeric);color:var(--text-secondary)}.nm{font:500 12px/1.3 var(--font-ui);color:var(--text-primary);min-width:118px}.mu{font:400 11px/1.3 var(--font-ui);color:var(--text-muted)}</style></head><body><div><div style="font:500 12px/1.4 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted)">New this week</div>
<div style="font-family:var(--font-display);font-size:36px;font-weight:600;letter-spacing:-.36px;line-height:1.11;margin-top:8px">Fresh from our ateliers</div>
<div style="display:flex;gap:22px;margin-top:14px">
<span style="font:500 12px/1.4 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--text-brand)">Editor's pick</span>
<span dir="rtl" style="font:500 12px/1.6 var(--font-ui);letter-spacing:.05em;color:var(--text-muted)">وصل حديثاً</span>
<span class="mu">Arabic keeps the tracking, skips the uppercase transform</span></div></div></body></html>
