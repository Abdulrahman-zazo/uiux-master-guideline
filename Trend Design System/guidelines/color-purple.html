<!-- @dsCard group="Colors" viewport="700x140" name="Purple ramp" subtitle="The brand's only chromatic voice — 50 through 900" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface-card);font-family:var(--font-ui)}.g{display:flex;gap:0;border-radius:var(--radius-card-sm);overflow:hidden}.sw{flex:1;height:66px;display:flex;flex-direction:column;justify-content:flex-end;padding:7px 9px;gap:1px}.sw b{font:500 10.5px/1.2 var(--font-ui)}.sw span{font:400 9.5px/1.2 var(--font-numeric);opacity:.75}.rows{display:flex;flex-direction:column;gap:9px}.r{display:flex;align-items:center;gap:11px}.chip{width:34px;height:34px;border-radius:9px;flex:0 0 auto;border:1px solid rgba(9,9,9,.08)}.tk{font:400 11.5px/1.3 var(--font-numeric);color:var(--text-secondary)}.nm{font:500 12px/1.3 var(--font-ui);color:var(--text-primary);min-width:118px}.mu{font:400 11px/1.3 var(--font-ui);color:var(--text-muted)}</style></head><body><div class="g"><div class="sw" style="background:#F7F1F9;color:#3D0F42"><b>50</b><span>#F7F1F9</span></div><div class="sw" style="background:#EEE0F2;color:#3D0F42"><b>100</b><span>#EEE0F2</span></div><div class="sw" style="background:#DCC2E4;color:#3D0F42"><b>200</b><span>#DCC2E4</span></div><div class="sw" style="background:#C89AD1;color:#3D0F42"><b>300</b><span>#C89AD1</span></div><div class="sw" style="background:#A96BB8;color:#fff"><b>400</b><span>#A96BB8</span></div><div class="sw" style="background:#984399;color:#fff"><b>500</b><span>#984399</span></div><div class="sw" style="background:#864596;color:#fff"><b>600</b><span>#864596</span></div><div class="sw" style="background:#6D1B72;color:#fff"><b>700</b><span>#6D1B72</span></div><div class="sw" style="background:#55155A;color:#fff"><b>800</b><span>#55155A</span></div><div class="sw" style="background:#3D0F42;color:#fff"><b>900</b><span>#3D0F42</span></div></div></body></html>
